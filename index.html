<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Player</title>
</head>
<body>
    <h1>Audio and Video Player</h1>
    <section>
        <h2>Video Player</h2>
        <video width="640" height="360" controls>
            <source src="https://cdn.freecodecamp.org/curriculum/labs/What is the map method and how does it work.mp4" type="video/mp4" controls>
            Your browser does not support the video element.
        </video>
    </section>
    <section>
        <h2>Audio Player</h2>
        <audio
            controls loop
            src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
        </audio>
    </section>
</body>
</html>
